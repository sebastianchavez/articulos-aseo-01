<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escribir reseña · Aseo+</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310B981'/%3E%3Cpath d='M20 34l8 8 16-18' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }, colors: { brand: { 50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669',700:'#047857',800:'#065F46',900:'#064E3B' } } } } }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
<meta name="currency" content="CLP">
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased">
  <div id="navbar"></div>

  <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <a id="back-link" href="#" class="text-brand-600 hover:text-brand-700 font-medium text-sm mb-4 inline-block">← Volver</a>
    <h1 class="text-3xl font-bold mb-2">Escribir reseña</h1>
    <p class="text-slate-600 mb-8">Comparte tu opinión sobre este producto.</p>

    <!-- Producto -->
    <div id="product-card" class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center gap-4 mb-6"></div>

    <!-- Form -->
    <form id="review-form" class="bg-white rounded-2xl border border-slate-200 p-6 space-y-5">
      <div>
        <label class="block text-sm font-semibold mb-2">Tu calificación *</label>
        <div id="stars-input" class="flex items-center gap-1">
          <button type="button" class="star-btn text-3xl text-slate-300 hover:text-amber-400 transition" data-value="1">★</button>
          <button type="button" class="star-btn text-3xl text-slate-300 hover:text-amber-400 transition" data-value="2">★</button>
          <button type="button" class="star-btn text-3xl text-slate-300 hover:text-amber-400 transition" data-value="3">★</button>
          <button type="button" class="star-btn text-3xl text-slate-300 hover:text-amber-400 transition" data-value="4">★</button>
          <button type="button" class="star-btn text-3xl text-slate-300 hover:text-amber-400 transition" data-value="5">★</button>
        </div>
        <p id="rating-label" class="text-sm text-slate-500 mt-2">Selecciona una calificación</p>
        <input type="hidden" name="rating" id="rating-input" required>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1.5">Tu nombre *</label>
        <input id="user-name" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1.5">Comentario</label>
        <textarea name="comment" rows="5" maxlength="500" placeholder="Cuéntanos qué te pareció el producto..." class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></textarea>
        <p class="text-xs text-slate-400 text-right mt-1"><span id="char-count">0</span>/500</p>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <a id="cancel-link" href="#" class="px-5 py-2.5 border border-slate-300 hover:bg-slate-50 rounded-lg font-semibold">Cancelar</a>
        <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg">Publicar reseña</button>
      </div>
    </form>
  </main>

  <div id="footer"></div>
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    AseoUI.mountLayout({ activeNav: '' });

    if (!AseoStore.auth.isAuthenticated()) {
      location.href = 'login.html?redirect=resena.html';
    }

    const productId = AseoUI.getQueryParam('productId');
    const orderId   = AseoUI.getQueryParam('orderId');
    const product = AseoData.getProductById(productId);

    if (!product) {
      document.querySelector('main').innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-2xl font-bold mb-4">Producto no encontrado</h1>
        </div>`;
    } else {
      document.getElementById('product-card').innerHTML = `
        <img src="${product.imagen}" class="w-20 h-20 rounded-xl object-cover">
        <div>
          <p class="text-xs text-slate-500 uppercase tracking-wide">${AseoData.getCategoryById(product.categoryId).name}</p>
          <h2 class="font-semibold">${AseoUI.escapeHTML(product.name)}</h2>
          <p class="text-xs text-slate-500">${AseoUI.formatCLP(product.precioDetalle)}</p>
        </div>`;

      const back = orderId ? 'pedido-detalle.html?id=' + orderId : 'producto.html?id=' + productId;
      document.getElementById('back-link').href = back;
      document.getElementById('cancel-link').href = back;

      const u = AseoStore.auth.getCurrent();
      document.getElementById('user-name').value = u.nombre || '';

      // Verificar si ya reseñó
      if (AseoStore.reviews.hasReviewed(productId, u.nombre || u.email)) {
        document.querySelector('main').innerHTML = `
          <div class="text-center py-20">
            <div class="text-5xl mb-4">✓</div>
            <h1 class="text-2xl font-bold mb-2">Ya reseñaste este producto</h1>
            <p class="text-slate-600 mb-6">Gracias por tu opinión.</p>
            <a href="${back}" class="text-brand-600 hover:underline">Volver</a>
          </div>`;
      }

      // Stars
      const labels = ['', 'Muy malo', 'Malo', 'Regular', 'Bueno', 'Excelente'];
      let rating = 0;
      document.querySelectorAll('.star-btn').forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          const v = Number(btn.dataset.value);
          document.querySelectorAll('.star-btn').forEach(b => {
            b.classList.toggle('text-amber-400', Number(b.dataset.value) <= v);
            b.classList.toggle('text-slate-300', Number(b.dataset.value) > v);
          });
        });
        btn.addEventListener('click', () => {
          rating = Number(btn.dataset.value);
          document.getElementById('rating-input').value = rating;
          document.getElementById('rating-label').textContent = labels[rating];
        });
      });
      document.getElementById('stars-input').addEventListener('mouseleave', () => {
        document.querySelectorAll('.star-btn').forEach(b => {
          b.classList.toggle('text-amber-400', Number(b.dataset.value) <= rating);
          b.classList.toggle('text-slate-300', Number(b.dataset.value) > rating);
        });
      });

      // Char counter
      document.querySelector('textarea[name="comment"]').addEventListener('input', e => {
        document.getElementById('char-count').textContent = e.target.value.length;
      });

      document.getElementById('review-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!rating) { AseoUI.toast('Selecciona una calificación', 'error'); return; }
        const fd = new FormData(e.target);
        AseoStore.reviews.add(productId, document.getElementById('user-name').value || 'Anónimo', rating, fd.get('comment') || '');
        AseoUI.toast('¡Reseña publicada!', 'success');
        setTimeout(() => location.href = back, 1200);
      });
    }
  </script>
</body>
</html>
