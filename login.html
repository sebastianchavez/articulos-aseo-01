<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Aseo+</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310B981'/%3E%3Cpath d='M20 34l8 8 16-18' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }, colors: { brand: { 50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669',700:'#047857',800:'#065F46',900:'#064E3B' } } } } }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased">
  <div id="navbar"></div>

  <main class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        </div>
        <h1 class="text-2xl font-bold">Bienvenido de vuelta</h1>
        <p class="text-sm text-slate-500">Ingresa a tu cuenta de Aseo+</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1.5">Email</label>
          <input type="email" name="email" required autocomplete="email" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="tu@correo.com">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-sm font-medium">Contraseña</label>
            <a href="recuperar-password.html" class="text-xs text-brand-600 hover:underline">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="relative">
            <input type="password" name="password" required autocomplete="current-password" id="pw" minlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 pr-12" placeholder="••••••••">
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="recordar" class="accent-brand-500">
          <span>Recordarme en este navegador</span>
        </label>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-lg transition">Ingresar</button>
      </form>

      <div class="my-6 flex items-center gap-3">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-400">o continúa con</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button class="border border-slate-300 hover:bg-slate-50 font-medium py-2.5 rounded-lg text-sm">🔵 Google</button>
        <button class="border border-slate-300 hover:bg-slate-50 font-medium py-2.5 rounded-lg text-sm">⚫ Facebook</button>
      </div>

      <p class="text-center text-sm text-slate-600 mt-6">
        ¿No tienes cuenta? <a href="registro.html" class="text-brand-600 font-semibold hover:underline">Crea una aquí</a>
      </p>
    </div>

    <div class="mt-4 bg-blue-50 border border-blue-200 text-blue-800 text-sm p-4 rounded-xl">
      <p class="font-semibold mb-1">💡 Cuenta demo</p>
      <p>Email: <code class="bg-white px-1.5 py-0.5 rounded">demo@aseo.cl</code> · Pass: <code class="bg-white px-1.5 py-0.5 rounded">123456</code></p>
    </div>
  </main>

  <div id="footer"></div>
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    AseoUI.mountLayout({ activeNav: '' });

    document.getElementById('toggle-pw').addEventListener('click', () => {
      const inp = document.getElementById('pw');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    const redirect = AseoUI.getQueryParam('redirect') || 'perfil.html';

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const result = AseoStore.auth.login(fd.get('email'), fd.get('password'));
      if (!result.ok) {
        AseoUI.toast(result.error, 'error');
        return;
      }
      AseoUI.toast(`Bienvenido/a, ${result.user.nombre || result.user.email}`, 'success');
      setTimeout(() => location.href = redirect, 800);
    });
  </script>
</body>
</html>
