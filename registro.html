<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Aseo+</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310B981'/%3E%3Cpath d='M20 34l8 8 16-18' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }, colors: { brand: { 50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669',700:'#047857',800:'#065F46',900:'#064E3B' } } } } }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased">
  <div id="navbar"></div>

  <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold">Crear cuenta</h1>
        <p class="text-sm text-slate-500">Únete a Aseo+ y disfruta de ofertas exclusivas.</p>
      </div>

      <form id="register-form" class="space-y-4">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Nombre completo *</label>
            <input name="nombre" required minlength="3" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Tu nombre">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Teléfono *</label>
            <input name="telefono" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="+56 9 ...">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Email *</label>
          <input type="email" name="email" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="tu@correo.com">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Dirección (opcional)</label>
          <input name="direccion" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Av. Principal 1234, Santiago">
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Contraseña *</label>
            <div class="relative">
              <input type="password" name="password" required minlength="6" id="pw" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 pr-12" placeholder="Mínimo 6 caracteres">
              <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
            <div id="pw-strength" class="text-xs mt-1.5"></div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Confirmar contraseña *</label>
            <input type="password" name="passwordConfirm" required minlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500" placeholder="Repite la contraseña">
          </div>
        </div>
        <label class="flex items-start gap-2 text-sm">
          <input type="checkbox" name="terminos" required class="accent-brand-500 mt-0.5">
          <span>Acepto los <a href="terminos-condiciones.html" class="text-brand-600 hover:underline" target="_blank">términos y condiciones</a> y la <a href="politicas-privacidad.html" class="text-brand-600 hover:underline" target="_blank">política de privacidad</a>.</span>
        </label>
        <label class="flex items-start gap-2 text-sm">
          <input type="checkbox" name="newsletter" class="accent-brand-500 mt-0.5">
          <span>Quiero recibir ofertas y novedades por email.</span>
        </label>
        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-lg transition">Crear mi cuenta</button>
      </form>

      <p class="text-center text-sm text-slate-600 mt-6">
        ¿Ya tienes cuenta? <a href="login.html" class="text-brand-600 font-semibold hover:underline">Ingresar</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    AseoUI.mountLayout({ activeNav: '' });

    document.getElementById('toggle-pw').addEventListener('click', () => {
      const inp = document.getElementById('pw');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    // Indicador de fuerza
    document.getElementById('pw').addEventListener('input', e => {
      const v = e.target.value;
      const el = document.getElementById('pw-strength');
      let strength = 0;
      if (v.length >= 6) strength++;
      if (v.length >= 10) strength++;
      if (/[A-Z]/.test(v)) strength++;
      if (/\d/.test(v)) strength++;
      if (/[^A-Za-z0-9]/.test(v)) strength++;
      const levels = ['', 'Muy débil', 'Débil', 'Aceptable', 'Fuerte', 'Muy fuerte'];
      const colors = ['', 'text-rose-600', 'text-rose-500', 'text-amber-600', 'text-sky-600', 'text-brand-600'];
      el.textContent = v ? `Seguridad: ${levels[strength]}` : '';
      el.className = 'text-xs mt-1.5 ' + (colors[strength] || '');
    });

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('passwordConfirm')) {
        AseoUI.toast('Las contraseñas no coinciden', 'error'); return;
      }
      if (!fd.get('terminos')) {
        AseoUI.toast('Debes aceptar los términos', 'error'); return;
      }
      const result = AseoStore.auth.register({
        nombre: fd.get('nombre'),
        email: fd.get('email'),
        telefono: fd.get('telefono'),
        direccion: fd.get('direccion'),
        password: fd.get('password')
      });
      if (!result.ok) {
        AseoUI.toast(result.error, 'error'); return;
      }
      AseoUI.toast('¡Cuenta creada con éxito!', 'success');
      setTimeout(() => location.href = 'perfil.html', 1000);
    });
  </script>
</body>
</html>
