<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compra confirmada · Aseo+</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310B981'/%3E%3Cpath d='M20 34l8 8 16-18' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }, colors: { brand: { 50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669',700:'#047857',800:'#065F46',900:'#064E3B' } } } } }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
<meta name="currency" content="CLP">
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased">
  <div id="navbar"></div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 print:py-0">
    <!-- Encabezado éxito -->
    <div class="text-center mb-10">
      <div class="w-20 h-20 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-5">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold mb-2">¡Compra confirmada!</h1>
      <p class="text-slate-600">Tu pedido ha sido registrado exitosamente. Te enviamos un email con los detalles.</p>
    </div>

    <!-- Comprobante -->
    <div id="comprobante" class="bg-white rounded-2xl border border-slate-200 overflow-hidden mb-8">
      <div class="p-6 border-b border-slate-200 bg-slate-50">
        <div class="flex flex-wrap justify-between items-start gap-4">
          <div>
            <p class="text-xs text-slate-500 uppercase tracking-wide">Comprobante</p>
            <h2 id="order-id" class="text-2xl font-bold text-brand-700">ASO-0000</h2>
            <p id="order-date" class="text-sm text-slate-500"></p>
          </div>
          <div class="text-right">
            <span id="order-status" class="inline-block bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-semibold">Preparando</span>
            <p class="text-xs text-slate-500 mt-2">Aseo+ · Artículos de aseo</p>
          </div>
        </div>
      </div>

      <div class="p-6 space-y-6">
        <!-- Items -->
        <div>
          <h3 class="font-semibold mb-3 text-sm uppercase tracking-wide text-slate-500">Productos</h3>
          <div id="order-items" class="space-y-3"></div>
        </div>

        <div class="grid sm:grid-cols-2 gap-6 pt-4 border-t border-slate-200">
          <div>
            <h3 class="font-semibold mb-2 text-sm uppercase tracking-wide text-slate-500">Dirección de envío</h3>
            <div id="order-address" class="text-sm text-slate-700 leading-relaxed"></div>
          </div>
          <div>
            <h3 class="font-semibold mb-2 text-sm uppercase tracking-wide text-slate-500">Envío y pago</h3>
            <div id="order-shipping" class="text-sm text-slate-700 mb-2"></div>
            <div id="order-payment" class="text-sm text-slate-700"></div>
          </div>
        </div>

        <div class="pt-4 border-t border-slate-200">
          <dl class="space-y-2 text-sm">
            <div class="flex justify-between"><dt>Subtotal</dt><dd id="c-subtotal" class="font-medium"></dd></div>
            <div class="flex justify-between"><dt>Envío</dt><dd id="c-envio" class="font-medium"></dd></div>
          </dl>
          <div class="flex justify-between text-xl font-bold mt-3 pt-3 border-t border-slate-200"><dt>Total pagado</dt><dd id="c-total" class="text-brand-700"></dd></div>
        </div>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="flex flex-col sm:flex-row gap-3 no-print">
      <button onclick="window.print()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
        Imprimir comprobante
      </button>
      <a href="perfil.html" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Ver historial de pedidos
      </a>
    </div>

    <div class="text-center mt-8 no-print">
      <a href="productos.html" class="text-brand-600 hover:text-brand-700 font-medium">← Seguir comprando</a>
    </div>
  </main>

  <div id="footer" class="no-print"></div>
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2 no-print"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    AseoUI.mountLayout({ activeNav: '' });

    const id = AseoUI.getQueryParam('id');
    const order = AseoStore.orders.getById(id);
    if (!order) {
      document.querySelector('main').innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-2xl font-bold mb-4">Pedido no encontrado</h1>
          <a href="productos.html" class="text-brand-600 hover:underline">Volver al catálogo</a>
        </div>`;
    } else {
      document.getElementById('order-id').textContent = order.id;
      document.getElementById('order-date').textContent = AseoUI.formatDate(order.fecha);
      const statusColors = {
        'Preparando': 'bg-amber-100 text-amber-700',
        'En camino':  'bg-sky-100 text-sky-700',
        'Entregado':  'bg-brand-100 text-brand-700',
        'Cancelado':  'bg-rose-100 text-rose-700'
      };
      const statusEl = document.getElementById('order-status');
      statusEl.textContent = order.estado;
      statusEl.className = 'inline-block px-3 py-1 rounded-full text-xs font-semibold ' + (statusColors[order.estado] || 'bg-slate-100 text-slate-700');

      document.getElementById('order-items').innerHTML = order.items.map(i => `
        <div class="flex gap-3">
          <img src="${i.imagen}" class="w-14 h-14 rounded-lg object-cover">
          <div class="flex-1 min-w-0">
            <p class="font-medium">${AseoUI.escapeHTML(i.nombre)}</p>
            <p class="text-xs text-slate-500">${i.cantidad} × ${AseoUI.formatCLP(i.precioUnitario)} ${i.tipoVenta === 'mayorista' ? '(mayor)' : ''}</p>
          </div>
          <p class="font-semibold">${AseoUI.formatCLP(i.precioUnitario * i.cantidad)}</p>
        </div>`).join('');

      const d = order.direccion;
      document.getElementById('order-address').innerHTML = `
        <p class="font-medium">${AseoUI.escapeHTML(d.nombre)}</p>
        <p>${AseoUI.escapeHTML(d.calle)}</p>
        <p>${AseoUI.escapeHTML(d.ciudad)}, ${AseoUI.escapeHTML(d.region)} ${d.codigoPostal ? '· CP ' + AseoUI.escapeHTML(d.codigoPostal) : ''}</p>
        <p class="text-slate-500">📞 ${AseoUI.escapeHTML(d.telefono)}</p>
        ${d.notas ? `<p class="text-xs mt-2 italic">Nota: ${AseoUI.escapeHTML(d.notas)}</p>` : ''}`;
      document.getElementById('order-shipping').innerHTML = `🚚 ${AseoUI.escapeHTML(order.envioTipo.nombre)}`;
      document.getElementById('order-payment').innerHTML  = `💳 ${AseoUI.escapeHTML(order.pagoTipo.nombre)} · ${AseoUI.escapeHTML(order.pagoTipo.detalle)}`;

      document.getElementById('c-subtotal').textContent = AseoUI.formatCLP(order.subtotal);
      document.getElementById('c-envio').textContent    = order.envio === 0 ? 'Gratis' : AseoUI.formatCLP(order.envio);
      document.getElementById('c-total').textContent    = AseoUI.formatCLP(order.total);
    }
  </script>
</body>
</html>
