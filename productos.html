<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · Aseo+</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310B981'/%3E%3Cpath d='M20 34l8 8 16-18' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }, colors: { brand: { 50:'#ECFDF5',100:'#D1FAE5',200:'#A7F3D0',300:'#6EE7B7',400:'#34D399',500:'#10B981',600:'#059669',700:'#047857',800:'#065F46',900:'#064E3B' } } } } }
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
<meta name="currency" content="CLP">
</head>
<body class="font-sans bg-slate-50 text-slate-800 antialiased">
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Encabezado + búsqueda -->
    <div class="mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold mb-2">Catálogo de productos</h1>
      <p class="text-slate-600 mb-6">Encuentra lo que necesitas para tu hogar o negocio.</p>
      <div class="flex flex-col md:flex-row gap-3">
        <div class="flex-1 relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="search" placeholder="Buscar productos..." class="w-full pl-12 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        </div>
        <select id="sort-select" class="px-4 py-3 border border-slate-300 rounded-xl bg-white">
          <option value="relevancia">Ordenar por relevancia</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="rating">Mejor valorados</option>
          <option value="nombre">Nombre A-Z</option>
        </select>
      </div>
    </div>

    <div class="grid lg:grid-cols-[280px_1fr] gap-8">
      <!-- SIDEBAR FILTROS -->
      <aside class="space-y-6">
        <div class="bg-white rounded-2xl border border-slate-200 p-5">
          <h3 class="font-bold mb-3">Categorías</h3>
          <div class="space-y-1" id="category-filters">
            <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer">
              <input type="radio" name="cat" value="" class="accent-brand-500" checked>
              <span class="text-sm">Todas las categorías</span>
            </label>
          </div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-5">
          <h3 class="font-bold mb-3">Precio (CLP)</h3>
          <div class="space-y-3">
            <div>
              <label class="text-xs text-slate-500">Mínimo</label>
              <input id="price-min" type="number" min="0" placeholder="0" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs text-slate-500">Máximo</label>
              <input id="price-max" type="number" min="0" placeholder="99999" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
          </div>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 p-5">
          <h3 class="font-bold mb-3">Tipo de venta</h3>
          <div class="space-y-1">
            <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer">
              <input type="radio" name="tipo" value="" class="accent-brand-500" checked>
              <span class="text-sm">Todos</span>
            </label>
            <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer">
              <input type="radio" name="tipo" value="detalle" class="accent-brand-500">
              <span class="text-sm">Solo al detalle</span>
            </label>
            <label class="flex items-center gap-2 px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer">
              <input type="radio" name="tipo" value="mayorista" class="accent-brand-500">
              <span class="text-sm">Solo al por mayor</span>
            </label>
          </div>
        </div>
        <button id="reset-filters" class="w-full text-sm text-slate-600 hover:text-brand-600 py-2 border border-slate-200 rounded-xl hover:border-brand-300">Limpiar filtros</button>
      </aside>

      <!-- GRILLA PRODUCTOS -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm text-slate-600"><span id="result-count">0</span> productos encontrados</p>
        </div>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        <div id="empty-state" class="hidden text-center py-16">
          <div class="text-5xl mb-3">🔍</div>
          <h3 class="text-lg font-semibold mb-1">No encontramos productos</h3>
          <p class="text-slate-600">Intenta ajustar los filtros o la búsqueda.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/products.js"></script>
  <script>
    AseoUI.mountLayout({ activeNav: 'productos' });
    AseoProducts.init();
  </script>
</body>
</html>
